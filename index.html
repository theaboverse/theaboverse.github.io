<script>

  const API_URL = "https://YOUR-RENDER-SERVICE.onrender.com";

  const countries = {

    IN: {
      currency: "INR",
      symbol: "₹",
      locale: "en-IN",
      payment: "🇮🇳 India: Cashfree / UPI / Cards"
    },

    US: {
      currency: "USD",
      symbol: "$",
      locale: "en-US",
      payment: "🇺🇸 USA: ACH / International payment"
    },

    GB: {
      currency: "GBP",
      symbol: "£",
      locale: "en-GB",
      payment: "🇬🇧 UK: International payment"
    },

    AE: {
      currency: "AED",
      symbol: "د.إ",
      locale: "en-AE",
      payment: "🇦🇪 UAE: International payment"
    },

    SA: {
      currency: "SAR",
      symbol: "﷼",
      locale: "en-SA",
      payment: "🇸🇦 Saudi Arabia: International payment"
    },

    KW: {
      currency: "KWD",
      symbol: "د.ك",
      locale: "en-KW",
      payment: "🇰🇼 Kuwait: International payment"
    },

    DE: {
      currency: "EUR",
      symbol: "€",
      locale: "de-DE",
      payment: "🇩🇪 Germany: International payment"
    },

    FR: {
      currency: "EUR",
      symbol: "€",
      locale: "fr-FR",
      payment: "🇫🇷 France: International payment"
    },

    JP: {
      currency: "JPY",
      symbol: "¥",
      locale: "ja-JP",
      payment: "🇯🇵 Japan: International payment"
    },

    SG: {
      currency: "SGD",
      symbol: "S$",
      locale: "en-SG",
      payment: "🇸🇬 Singapore: International payment"
    }

  };


  /*
    DISPLAY FX ONLY

    Actual payment amount should be confirmed
    in the final invoice/payment gateway.

    These are example display rates.
  */

  const FX = {
    INR: 1,
    USD: 0.0119,
    GBP: 0.0091,
    AED: 0.0437,
    SAR: 0.0446,
    KWD: 0.00365,
    EUR: 0.0101,
    JPY: 1.76,
    SGD: 0.0153
  };


  function formatMoney(inr, country) {

    const data = countries[country];

    const converted = inr * FX[data.currency];

    return new Intl.NumberFormat(
      data.locale,
      {
        style: "currency",
        currency: data.currency,
        maximumFractionDigits:
          data.currency === "JPY" ? 0 : 2
      }
    ).format(converted);

  }


  function updateCountry() {

    const country =
      document.getElementById("countrySelect").value;

    const data = countries[country];

    document.getElementById("paymentInfo").innerHTML =
      data.payment +
      "<br><small>Prices shown in local currency are indicative. Final payment amount is confirmed on the invoice/payment page.</small>";

    document.querySelectorAll(".amount").forEach(el => {

      const inr = Number(el.dataset.inr);

      el.innerText =
        formatMoney(inr, country);

    });

  }


  document
    .getElementById("countrySelect")
    .addEventListener("change", updateCountry);


  function selectPlan(amount) {

    document.getElementById("plan").value =
      amount;

    document
      .getElementById("payment")
      .scrollIntoView({
        behavior: "smooth"
      });

  }


  function toast(message) {

    const t =
      document.getElementById("toast");

    t.innerText = message;
    t.style.display = "block";

    setTimeout(() => {
      t.style.display = "none";
    }, 4500);

  }


  async function payAdvance() {

    const name =
      document.getElementById("customerName").value.trim();

    const email =
      document.getElementById("customerEmail").value.trim();

    const phone =
      document.getElementById("customerPhone").value.trim();

    const plan =
      Number(document.getElementById("plan").value);

    const details =
      document.getElementById("projectDetails").value.trim();

    const country =
      document.getElementById("countrySelect").value;


    if (!name || !email || !phone) {

      toast("Please enter your name, email and phone.");

      return;

    }


    const advance =
      plan / 2;


    /*
      INDIA

      Cashfree checkout is created by backend.
    */

    if (country === "IN") {

      try {

        toast("Creating secure Cashfree payment...");

        const response =
          await fetch(
            API_URL + "/api/create-order",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                name,
                email,
                phone,

                planAmount: plan,
                advanceAmount: advance,

                projectDetails

              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Payment order could not be created."
          );

        }


        const cashfree =
          Cashfree({
            mode: "production"
          });


        cashfree.checkout({

          paymentSessionId:
            data.payment_session_id,

          redirectTarget: "_self"

        });


      } catch (error) {

        toast(error.message);

      }

      return;

    }


    /*
      INTERNATIONAL

      ACH/manual bank transfer instructions.
    */

    const data =
      countries[country];


    toast(
      "International payment selected. Please use the bank/payment instructions provided in your invoice."
    );


    alert(
      `${data.payment}\n\n` +
      `Project value: ${formatMoney(plan,country)}\n` +
      `50% advance: ${formatMoney(advance,country)}\n\n` +
      `A payment invoice with the applicable payment instructions will be provided.`
    );

  }


  /*
    Try to detect user's country from browser locale.
    User can always change it manually.
  */

  function detectCountry() {

    const locale =
      Intl.DateTimeFormat()
        .resolvedOptions()
        .locale
        .toUpperCase();

    const possible =
      Object.keys(countries)
        .find(code =>
          locale.includes("-" + code)
        );

    if (possible) {

      document.getElementById(
        "countrySelect"
      ).value = possible;

    }

    updateCountry();

  }


  detectCountry();

</script>

</body>
</html>
