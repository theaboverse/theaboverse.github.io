<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | ARB Globle IT & Service</title>

  <meta name="description" content="Thank you for contacting ARB Globle IT & Service.">

  <link rel="icon" href="logo.png">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(0,229,255,.12),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(53,169,255,.12),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #030812,
          #071525
        );

      overflow: hidden;
    }

    .ring {
      position: fixed;
      width: 150px;
      height: 150px;
      border: 3px solid rgba(0,229,255,.45);
      border-radius: 50%;
      animation: fall 10s linear infinite;
      pointer-events: none;
    }

    .ring:nth-child(1) {
      left: 10%;
      animation-delay: -2s;
    }

    .ring:nth-child(2) {
      left: 55%;
      width: 80px;
      height: 80px;
      animation-duration: 13s;
      animation-delay: -7s;
    }

    .ring:nth-child(3) {
      left: 85%;
      width: 120px;
      height: 120px;
      animation-duration: 16s;
      animation-delay: -10s;
    }

    @keyframes fall {
      from {
        top: -200px;
        transform:
          rotateX(60deg)
          rotateY(0deg);
        opacity: 0;
      }

      20% {
        opacity: .7;
      }

      to {
        top: 110vh;
        transform:
          rotateX(360deg)
          rotateY(360deg);
        opacity: 0;
      }
    }

    .box {
      width: min(650px, 100%);
      text-align: center;
      padding: 45px 30px;

      border-radius: 25px;

      background:
        rgba(7,21,37,.86);

      border:
        1px solid
        rgba(0,229,255,.22);

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.45);

      backdrop-filter: blur(20px);

      position: relative;
      z-index: 2;
    }

    img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 40px;
      margin: 0 0 15px;
    }

    h1 span {
      color: #00e5ff;
    }

    p {
      color: #a9bbce;
      line-height: 1.8;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
    }

    a {
      padding: 13px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }

    .primary {
      background: #00e5ff;
      color: #00111d;
    }

    .secondary {
      border: 1px solid rgba(0,229,255,.25);
      color: white;
    }

    .contact {
      margin-top: 25px;
      font-size: 13px;
    }

  </style>
</head>

<body>

  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>

  <div class="box">

    <img
      src="logo.png"
      alt="ARB Globle IT & Service"
    >

    <h1>
      Thank <span>You!</span>
    </h1>

    <p>
      Thank you for contacting
      <strong>ARB Globle IT & Service</strong>.
    </p>

    <p>
      Your project requirements have been received.
      Our team will contact you regarding the next steps,
      project scope, payment and launch process.
    </p>

    <div class="buttons">

      <a
        class="primary"
        href="https://wa.me/918127968129"
        target="_blank"
      >
        Contact on WhatsApp
      </a>

      <a
        class="secondary"
        href="index.html"
      >
        Back to Website
      </a>

    </div>

    <div class="contact">
      arbglobalitservice@gmail.com
      <br>
      +91 8127968129
    </div>

  </div>

</body>
</html>
